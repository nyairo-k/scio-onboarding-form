<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join Our Expert Network</title>
    <!-- Assuming you have a style.css file in the same folder -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Join Our Expert Network</h1>
        <form id="expertApplicationForm">
            <!-- FULL NAME -->
            <div class="form-group">
                <label for="fullName">Full Name</label>
                <input type="text" id="fullName" name="fullName" placeholder="Your full name" required>
            </div>

            <!-- EMAIL -->
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" placeholder="name@example.com" required>
            </div>

            <!-- LINKEDIN -->
            <div class="form-group">
                <label for="linkedinUrl">LinkedIn Profile URL</label>
                <input type="url" id="linkedinUrl" name="linkedinUrl" placeholder="https://linkedin.com/in/yourprofile" required>
            </div>

            <!-- CV UPLOAD -->
            <div class="form-group">
                <label for="cvFile">Upload Your CV/Resume <span class="accepted-formats">(Accepted formats: .pdf, .doc, .docx)</span></label>
                <input type="file" id="cvFile" name="cvFile" accept=".pdf,.doc,.docx" required>
            </div>

            <!-- HOW HEARD -->
            <div class="form-group">
                <label for="howHeard">How did you hear about us?</label>
                <select id="howHeard" name="howHeard">
                    <option value="">Please select</option>
                    <option value="linkedin">LinkedIn</option>
                    <option value="referral">Referral</option>
                    <option value="google_search">Google Search</option>
                    <option value="event">Event</option>
                    <option value="other">Other</option>
                </select>
            </div>

            <!-- WORKED WITH SCIO (CONDITIONAL LOGIC) -->
            <div class="form-group">
                <label>Have you worked with SCIO before?</label>
                <div class="radio-group">
                    <input type="radio" id="workedScioYes" name="workedScio" value="true" required>
                    <label for="workedScioYes">Yes</label>
                    <input type="radio" id="workedScioNo" name="workedScio" value="false" required>
                    <label for="workedScioNo">No</label>
                </div>
                <!-- This div is hidden by default via JS -->
                <div id="scioProjectDetailsContainer" style="display:none;">
                    <label for="scioProjectDetails">Please specify the project or capacity:</label>
                    <textarea id="scioProjectDetails" name="scioProjectDetails" rows="3"></textarea>
                </div>
            </div>

            <!-- CONSENT BOX 1 -->
            <div class="consent-box">
                <h2>Data Privacy and Protection</h2>
                <p>By submitting this application, you agree to our <a href="privacy.html" target="_blank">Privacy Policy</a>...</p>
                <div class="checkbox-group">
                    <input type="checkbox" id="consentDataPrivacy" name="consentDataPrivacy" required>
                    <label for="consentDataPrivacy">I agree to the Data Privacy and Protection policy.</label>
                </div>
            </div>

            <!-- CONSENT BOX 2 -->
            <div class="consent-box">
                <h2>AI-Powered CV Analysis</h2>
                <p>We utilize Artificial Intelligence to analyze your CV...</p>
                <div class="checkbox-group">
                    <input type="checkbox" id="consentAiAnalysis" name="consentAiAnalysis" required>
                    <label for="consentAiAnalysis">I consent to the AI analysis of my CV.</label>
                </div>
            </div>

            <!-- SUBMIT BUTTON -->
            <button type="submit" id="submitButton" disabled>Submit Application</button>
            <p id="consentReminder" class="consent-reminder">Please agree to both terms above to enable submission.</p>
            <p id="submissionMessage" class="submission-message"></p>
        </form>
    </div>

<!-- 1. IMPORT SUPABASE LIBRARY -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
document.addEventListener('DOMContentLoaded', function() {
    
    // 2. INITIALIZE CONNECTION
    const SUPABASE_URL = 'https://pvywobxbuwpybsvegzys.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InB2eXdvYnhidXdweWJzdmVnenlzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTg1MzY3MzQsImV4cCI6MjA3NDExMjczNH0.f5R0f1o75WQ-5tQXcZ3ckkc5Fs_WiVEsXq-EOpxOhGg';
    
    // FIX: We name this 'supabaseClient' to avoid conflict with the library 'supabase'
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // 3. GET HTML ELEMENTS (The Hooks)
    const form = document.getElementById('expertApplicationForm');
    const submitButton = document.getElementById('submitButton');
    
    const workedScioYes = document.getElementById('workedScioYes');
    const workedScioNo = document.getElementById('workedScioNo');
    const scioDetailsContainer = document.getElementById('scioProjectDetailsContainer');
    const scioDetailsInput = document.getElementById('scioProjectDetails');

    const consentPrivacy = document.getElementById('consentDataPrivacy');
    const consentAi = document.getElementById('consentAiAnalysis');
    const consentReminder = document.getElementById('consentReminder');

    // 4. LOGIC: TOGGLE 'WORKED WITH SCIO'
    function handleScioToggle() {
        if (workedScioYes.checked) {
            scioDetailsContainer.style.display = 'block'; // Show it
            scioDetailsInput.setAttribute('required', 'true'); // Make it mandatory
        } else {
            scioDetailsContainer.style.display = 'none'; // Hide it
            scioDetailsInput.removeAttribute('required'); // Make it optional
            scioDetailsInput.value = ''; // Clear text
        }
    }

    if(workedScioYes && workedScioNo) {
        workedScioYes.addEventListener('change', handleScioToggle);
        workedScioNo.addEventListener('change', handleScioToggle);
        handleScioToggle(); // Run immediately on load
    }

    // 5. LOGIC: ENABLE SUBMIT BUTTON (Only if checkboxes checked)
    function checkConsents() {
        if (consentPrivacy.checked && consentAi.checked) {
            submitButton.disabled = false;
            consentReminder.style.display = 'none';
        } else {
            submitButton.disabled = true;
            consentReminder.style.display = 'block';
        }
    }

    if(consentPrivacy && consentAi) {
        consentPrivacy.addEventListener('change', checkConsents);
        consentAi.addEventListener('change', checkConsents);
        checkConsents(); // Run immediately on load
    }

    // 6. LOGIC: HANDLE FORM SUBMISSION
    form.addEventListener('submit', async (e) => {
        // Prevent the browser from refreshing
        e.preventDefault();
        
        const submissionMessage = document.getElementById('submissionMessage');
        const originalBtnText = submitButton.innerText;

        // Visual Feedback (Loading state)
        submitButton.disabled = true;
        submitButton.innerText = "Uploading...";
        submissionMessage.textContent = 'Processing your application...';
        submissionMessage.style.color = 'black';

        try {
            // STEP A: GET FILE
            const cvFile = document.getElementById('cvFile').files[0];
            if (!cvFile) throw new Error("Please select a file.");

            // STEP B: UPLOAD FILE TO SUPABASE STORAGE
            const fileName = `${Date.now()}_${cvFile.name.replace(/\s/g, '_')}`;
            const { data: fileData, error: fileError } = await supabaseClient.storage
                .from('cv_submissions')
                .upload(fileName, cvFile);

            if (fileError) throw fileError;

            // STEP C: PREPARE DATA
            let workedWithScioValue = false;
            const workedRadio = document.querySelector('input[name="workedScio"]:checked');
            if(workedRadio) {
                workedWithScioValue = workedRadio.value === 'true'; // Convert string "true" to Boolean true
            }

            // STEP D: INSERT DATA INTO SUPABASE DATABASE
            const { error: dbError } = await supabaseClient
                .from('expert_applications')
                .insert([{
                    full_name: document.getElementById('fullName').value,
                    email: document.getElementById('email').value,
                    linkedin_url: document.getElementById('linkedinUrl').value,
                    how_heard: document.getElementById('howHeard').value,
                    worked_with_scio: workedWithScioValue,
                    scio_project_details: document.getElementById('scioProjectDetails').value,
                    consent_data_privacy: consentPrivacy.checked,
                    consent_ai_analysis: consentAi.checked,
                    cv_storage_path: fileData.path, // Link the file we just uploaded
                    extraction_status: 'Pending'
                }]);

            if (dbError) throw dbError;

            // STEP E: SUCCESS
            submissionMessage.textContent = 'Success! Application received.';
            submissionMessage.style.color = 'green';
            form.reset(); // Clear the form
            
            // Reset UI
            handleScioToggle();
            checkConsents();
            submitButton.innerText = originalBtnText;

        } catch (error) {
            console.error('Submission Error:', error);
            submissionMessage.textContent = 'Error: ' + error.message;
            submissionMessage.style.color = 'red';
            submitButton.disabled = false;
            submitButton.innerText = originalBtnText;
        }
    });
});
</script>
</body>
</html>
